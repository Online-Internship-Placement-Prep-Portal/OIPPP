name: PR automation

on:
  pull_request_target:
    types: [opened, reopened, synchronize, ready_for_review]

permissions:
  contents: read
  pull-requests: write
  issues: write

jobs:
  triage:
    runs-on: ubuntu-latest
    steps:
      # labels the PR with its feature area from the files it touches
      - uses: actions/labeler@v5
        with:
          configuration-path: .github/labeler.yml

      # the member who raised the PR owns it (Part-2 rule 2c)
      - name: Assign author
        if: github.event.action == 'opened'
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.issues.addAssignees({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              assignees: [context.payload.pull_request.user.login],
            });

      - name: Check commit message convention
        uses: actions/github-script@v7
        with:
          script: |
            const commits = await github.paginate(github.rest.pulls.listCommits, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: context.issue.number,
            });
            const pattern = /^(feat|fix|docs|test|refactor|chore|ci)(\([\w-]+\))?: .+/;
            const bad = commits
              .map((c) => c.commit.message.split('\n')[0])
              .filter((m) => !pattern.test(m) && !m.startsWith('Merge '));
            if (bad.length) {
              core.warning(`Commits not following <type>(<scope>): <summary>:\n${bad.join('\n')}`);
            }
